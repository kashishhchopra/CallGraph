paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  manifests_dir: data/manifests
  labels_dir: data/labels
  cache_dir: data/cache
  models_dir: models
  outputs_dir: outputs
  prompts_dir: prompts
  configs_dir: configs
logging:
  level: INFO
  format: "{time:HH:mm:ss} | {level: <7} | {name}:{line} | {message}"
falkordb:
  host: localhost
  port: 6379
  graph_name: callgraph
llm:
  provider: ollama          # ollama | openai | anthropic
  model: llama3.2:3b
  base_url: http://localhost:11434
  timeout_s: 300
  max_tokens: 1024
  keep_alive: 30m           # keep the Ollama model loaded between questions
  max_retries: 3
  temperature: 0.0
  json_mode: true
  cache_enabled: true
  retry_backoff_s: 2.0
  anthropic_max_tokens: 2048
  anthropic_version: "2023-06-01"
  num_ctx: 8192
  cache_subdir: llm
  error_trunc_chars: 300
  health_timeout_s: 5
api:
  host: 0.0.0.0
  port: 8010
  default_page_size: 20
  max_page_size: 100
  call_id_hex_len: 12
dashboard:
  port: 8501
  api_base_url: http://localhost:8010
features:
  streaming: false
  dual_channel: true
tracking:
  backend: mlflow           # mlflow | wandb | none
  experiment_name: callgraph
  max_param_chars: 250
  log_every_steps: 50
vector_store:
  backend: faiss            # faiss | falkordb
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size_turns: 6
  chunk_overlap_turns: 2
downloads:
  bytes_per_gb: 1.0e9
  bytes_per_mb: 1048576
  small_file_gb: 0.01
  min_free_gb: 4.0          # refuse downloads that would leave less free disk than this
  http_timeout_s: 120
  chunk_bytes: 1048576
  user_agent: callgraph-research/0.1
manifest:
  columns: [id, audio_path, transcript_path, duration_s, split, labels]
split:
  ratios: {train: 0.8, validation: 0.1, test: 0.1}
  seed: 42
privacy:
  enabled: true
  language: en
  spacy_model: en_core_web_sm
  entities: [PHONE_NUMBER, EMAIL_ADDRESS, CREDIT_CARD, PERSON, US_SSN, IBAN_CODE]
  placeholder_format: "<{entity}>"
  score_threshold: 0.4
rttm:
  min_fields: 8
  start_idx: 3
  duration_idx: 4
  speaker_idx: 7
  type_label: SPEAKER
